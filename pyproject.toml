[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpm"
version = "1.0.0"
description = "A US equity momentum and inverse-volatility study rebuilt in Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "David Dümig" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "certifi>=2024.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
